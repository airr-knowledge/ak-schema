---
id: https://github.com/airr-knowledge/ak-schema
name: ak-schema

classes:

  ImmuneSystem:
    abstract: true
    is_a: NamedThing
    class_uri: UBERON:0002405 # immune system

  Chain:
    abstract: true
    is_a: AKObject
    slots:
      - species
      - complete_vdj
      - sequence
      - sequence_aa
      - locus
      - v_call
      - v_gene
      - v_subgroup
      - d_call
      - j_call
      - j_gene
      - j_subgroup
      - c_call
      - junction_aa
      - cdr1_aa
      - cdr2_aa
    slot_usage:
      sequence_aa:
        pattern: "^[ACDEFGHIKLMNPQRSTVWY]+$"
      junction_aa:
        pattern: "^C[ACDEFGHIKLMNPQRSTVWY]+$"

  ChainInferences:
    abstract: true
    slots:
      - infer_vdj_sequence
      - hash_infer_vdj_sequence
      - infer_vdj_sequence_aa
      - hash_infer_vdj_sequence_aa

  CanonicalAlphaChain:
    is_a: Chain

  CanonicalBetaChain:
    is_a: Chain

  CanonicalDeltaChain:
    is_a: Chain

  CanonicalGammaChain:
    is_a: Chain

  CanonicalHeavyChain:
    is_a: Chain

  CanonicalKappaChain:
    is_a: Chain

  CanonicalLambdaChain:
    is_a: Chain

  AlphaChain:
    is_a: Chain
    mixins: ChainInferences
    slot_usage:
      hash_infer_vdj_sequence_aa:
        range: CanonicalAlphaChain

  BetaChain:
    is_a: Chain
    mixins: ChainInferences
    slot_usage:
      hash_infer_vdj_sequence_aa:
        range: CanonicalBetaChain

  DeltaChain:
    is_a: Chain
    mixins: ChainInferences
    slot_usage:
      hash_infer_vdj_sequence_aa:
        range: CanonicalDeltaChain

  GammaChain:
    is_a: Chain
    mixins: ChainInferences
    slot_usage:
      hash_infer_vdj_sequence_aa:
        range: CanonicalGammaChain

  HeavyChain:
    is_a: Chain
    mixins: ChainInferences
    slot_usage:
      hash_infer_vdj_sequence_aa:
        range: CanonicalHeavyChain

  KappaChain:
    is_a: Chain
    mixins: ChainInferences
    slot_usage:
      hash_infer_vdj_sequence_aa:
        range: CanonicalKappaChain

  LambdaChain:
    is_a: Chain
    mixins: ChainInferences
    slot_usage:
      hash_infer_vdj_sequence_aa:
        range: CanonicalLambdaChain

  ImmuneReceptor:
    abstract: true
    is_a: AKObject
    slots:
      - species
      - paired_chain

  TCellReceptor:
    abstract: true
    is_a: ImmuneReceptor
    class_uri: GO:0042101

  AlphaBetaTCR:
    is_a: TCellReceptor
    class_uri: GO:0042105
    slots:
      - tra_chain
      - trb_chain

  GammaDeltaTCR:
    is_a: TCellReceptor
    class_uri: GO:0042106
    slots:
      - trg_chain
      - trd_chain

  BCellReceptor:
    abstract: true
    is_a: ImmuneReceptor

  HeavyKappaBCR:
    is_a: BCellReceptor
    slots:
      - igh_chain
      - igk_chain

  HeavyLambdaBCR:
    is_a: BCellReceptor
    slots:
      - igh_chain
      - igl_chain

  # the akc_id is same CURIE as the epitope_ref
  Epitope:
    is_a: AKObject
    class_uri: OBI:1110001 # epitope
    slots:
      - epitope_ref

  PeptidicEpitope:
    is_a: Epitope
    slots:
      - sequence_aa
      - modifications
    slot_usage:
      sequence_aa:
        pattern: '^[ACDEFGHIKLMNPQRSTVWY]+$'

  DiscontinuousEpitope:
    is_a: Epitope
    slots:
      - positional_residues
    slot_usage:
      positional_residues:
        pattern: '^([ACDEFGHIKLMNPQRSTVWY]\d{1,}, ){0,}[ACDEFGHIKLMNPQRSTVWY]\d{1,}$'

  NonPeptidicEpitope:
    is_a: Epitope
    slots:
      - epitope_name

  # the akc_id is same CURIE as the source molecule ID
  Antigen:
    is_a: AKObject
    class_uri: OBI:1110034 # antigen
    slots:
      - source_molecule
      - source_species
      - epitopes

  MajorHistocompatibilityComplex:
    is_a: AKObject
    class_uri: GO:0042611 # MHC protein complex
    slots:
      - mhc_ref # MRO CURIE
      - mhc_class
      - mhc_label
    slot_usage:
      mhc_ref:
        range: MHCRestriction

  HeavyKappaBCRAntigenComplex:
    abstract: true
    is_a: AKObject
    class_uri: OBI:0003119
    slots:
      - species
      - hk_bcr
      - antigen
      - epitope

  HeavyLambdaBCRAntigenComplex:
    abstract: true
    is_a: AKObject
    class_uri: OBI:0003119
    slots:
      - species
      - hl_bcr
      - antigen
      - epitope

  AlphaBetaTCRpMHCComplex:
    abstract: true
    is_a: AKObject
    class_uri: OBI:0003119
    slots:
      - species
      - ab_tcr
      - antigen
      - epitope
      - mhc

  GammaDeltaTCRpMHCComplex:
    abstract: true
    is_a: AKObject
    class_uri: OBI:0003119
    slots:
      - species
      - gd_tcr
      - antigen
      - epitope
      - mhc

slots:
  paired_chain:
    name: paired_chain
    description: Flag to indicate the receptor object has both chains defined
    range: boolean

  complete_vdj:
    name: complete_vdj
    description: Complete VDJ flag.
    range: boolean

  sequence:
    name: sequence
    description: Nucleotide sequence.
    range: string

  infer_vdj_sequence:
    name: infer_vdj_sequence
    description: Inferred complete VDJ nucleotide sequence.
    range: string

  hash_infer_vdj_sequence:
    name: hash_infer_vdj_sequence
    description: Hash of the inferred complete VDJ nucleotide sequence.
    range: uriorcurie

  infer_vdj_sequence_aa:
    name: infer_vdj_sequence_aa
    description: Translation of inferred complete VDJ nucleotide sequence.
    range: string

  hash_infer_vdj_sequence_aa:
    name: hash_infer_vdj_sequence_aa
    description: Hash of the translation of inferred complete VDJ nucleotide sequence.
    range: uriorcurie

  v_gene:
    name: v_gene
    description: V gene designation for the chain
    range: string

  v_subgroup:
    name: v_subgroup
    description: V gene subgroup/family designation for the chain
    range: string

  j_gene:
    name: j_gene
    description: J gene designation for the chain
    range: string

  j_subgroup:
    name: j_subgroup
    description: J gene subgroup/family designation for the chain
    range: string

  isotype:
    name: isotype
    description: The isotype of the chain
    range: string

  igh_chain:
    description: IG heavy chain
    range: CanonicalHeavyChain

  igl_chain:
    description: IG lambda light chain
    range: CanonicalLambdaChain

  igk_chain:
    description: IG kappa light chain
    range: CanonicalKappaChain

  tra_chain:
    description: T cell receptor alpha chain
    range: CanonicalAlphaChain

  trb_chain:
    description: T cell receptor beta chain
    range: CanonicalBetaChain

  trd_chain:
    description: T cell receptor delta chain
    range: CanonicalDeltaChain

  trg_chain:
    description: T cell receptor gamma chain
    range: CanonicalGammaChain

  ab_tcr:
    description: alpha/beta T cell receptor
    range: AlphaBetaTCR

  gd_tcr:
    description: gamma/delta T cell receptor
    range: GammaDeltaTCR

  hk_bcr:
    description: heavy/kappa B cell receptor
    range: HeavyKappaBCR

  hl_bcr:
    description: heavy/lambda B cell receptor
    range: HeavyLambdaBCR

  source_molecule:
    description: The protein or other molecule that this antigen represents

  source_species:
    description: The species that the source molecule comes from
    range: TaxonomicSpecies

  antibody:
    description: B cell receptor, immunoglobulin antibody
    range: BCellReceptor

  antigen:
    description: A material entity with antigen role
    range: Antigen

  epitope:
    description: Epitope of an antigen, which can be recognized by a T cell receptor or antibody
    range: Epitope

  epitopes:
    description: Set of epitopes for an antigen
    range: Epitope
    multivalued: true

  epitope_ref:
    description: CURIE identifiers for external epitope records
    range: uriorcurie

  positional_residues:
    description: Numbered amino acid residues of a conformational epitope
    range: string

  modifications:
    description: Post-translational modifications to the epitope peptide sequence
    range: string

  mhc:
    description: Major histocompatibility complex
    range: MajorHistocompatibilityComplex

  mhc_ref:
    description: MHC Restriction Ontology term id
    range: MHCRestriction

  epitope_name:
    description: Name of the non-peptidic epitope
    range: string

  mhc_label:
    description: Human-readable label of the major histocompatibility complex
    range: string

  mhc_class:
    description: Class of the major histocompatibility complex
    range: MhcClassEnum # from AIRR
