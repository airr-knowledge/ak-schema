---
id: https://github.com/airr-knowledge/ak-schema
name: ak-schema

classes:

  ImmuneSystem:
    abstract: true
    is_a: NamedThing
    class_uri: UBERON:0002405 # immune system

  Chain:
    abstract: true
    is_a: AKObject
    slots:
      - species
      - complete_vdj
      - sequence
      - infer_vdj_sequence
      - hash_infer_vdj_sequence
      - sequence_aa
      - infer_vdj_sequence_aa
      - hash_infer_vdj_sequence_aa
      - locus
      - v_call
      - v_gene
      - v_subgroup
      - d_call
      - j_call
      - j_gene
      - j_subgroup
      - c_call
      - junction_aa
      - cdr1_aa
      - cdr2_aa
      - cdr3_aa
    slot_usage:
      sequence_aa:
        pattern: "^[ACDEFGHIKLMNPQRSTVWY]+$"
      junction_aa:
        pattern: "^C[ACDEFGHIKLMNPQRSTVWY]+$"

  AlphaChain:
    is_a: Chain

  BetaChain:
    is_a: Chain

  DeltaChain:
    is_a: Chain

  GammaChain:
    is_a: Chain

  HeavyChain:
    is_a: Chain

  KappaChain:
    is_a: Chain

  LambdaChain:
    is_a: Chain

  ImmuneReceptor:
    abstract: true
    is_a: AKObject
    slots:
      - species

  TCellReceptor:
    abstract: true
    is_a: ImmuneReceptor
    class_uri: GO:0042101

  AlphaBetaTCR:
    is_a: TCellReceptor
    class_uri: GO:0042105
    slots:
      - tra_chain
      - trb_chain

  GammaDeltaTCR:
    is_a: TCellReceptor
    class_uri: GO:0042106
    slots:
      - trg_chain
      - trd_chain

  BCellReceptor:
    is_a: ImmuneReceptor
    slots:
      - igh_chain
      - igk_chain
      - igl_chain

  Epitope:
    is_a: AKObject
    class_uri: OBI:1110001 # epitope
    slots:
      - epitope_ref # IEDB (or other source) CURIE

  PeptidicEpitope:
    is_a: Epitope
    slots:
      - sequence_aa
      - modifications
    slot_usage:
      sequence_aa:
        pattern: '^[ACDEFGHIKLMNPQRSTVWY]+$'

  DiscontinuousEpitope:
    is_a: Epitope
    slots:
      - positional_residues
    slot_usage:
      positional_residues:
        pattern: '^([ACDEFGHIKLMNPQRSTVWY]\d{1,}, ){0,}[ACDEFGHIKLMNPQRSTVWY]\d{1,}$'

  NonPeptidicEpitope:
    is_a: Epitope
    slots:
      - epitope_name

  Antigen:
    is_a: AKObject
    class_uri: OBI:1110034 # antigen
    slots:
      - source_molecule
      - source_species
      - epitope

  MajorHistocompatibilityComplex:
    is_a: AKObject
    class_uri: GO:0042611 # MHC protein complex
    slots:
      - mhc_ref # MRO CURIE
      - mhc_class
      - mhc_label

  AntibodyAntigenComplex:
    abstract: true
    is_a: AKObject
    class_uri: OBI:0003119
    slots:
      - species
      - antibody
      - antigen

  TCRpMHCComplex:
    abstract: true
    is_a: AKObject
    class_uri: OBI:0003119
    slots:
      - species
      - ab_tcr
      - gd_tcr
      - antigen
      - mhc

  # class for database optimization
  ReceptorComposite:
    is_a: AKObject
    mixins:
      - AlphaBetaTCR
      - GammaDeltaTCR
      - BCellReceptor
    slots:
      - species
      - tcr_complex
      - antibody_complex
      - antigen
      - epitope
      - mhc

slots:
  aa_hash:
    name: aa_hash
    range: string

  junction_aa_vj_allele_hash:
    name: junction_aa_vj_allele_hash
    range: string

  junction_aa_vj_gene_hash:
    name: junction_aa_vj_gene_hash
    range: string

  complete_vdj:
    name: complete_vdj
    description: Complete VDJ flag.
    range: boolean

  sequence:
    name: sequence
    description: Nucleotide sequence.
    range: string

  infer_vdj_sequence:
    name: infer_vdj_sequence
    description: Inferred complete VDJ nucleotide sequence.
    range: string

  hash_infer_vdj_sequence:
    name: hash_infer_vdj_sequence
    description: Hash of the inferred complete VDJ nucleotide sequence.
    range: uriorcurie

  infer_vdj_sequence_aa:
    name: infer_vdj_sequence_aa
    description: Translation of inferred complete VDJ nucleotide sequence.
    range: string

  hash_infer_vdj_sequence_aa:
    name: hash_infer_vdj_sequence_aa
    description: Hash of the translation of inferred complete VDJ nucleotide sequence.
    range: uriorcurie

  v_gene:
    name: v_gene
    description: V gene designation for the chain
    range: string

  v_subgroup:
    name: v_subgroup
    description: V gene subgroup/family designation for the chain
    range: string

  j_gene:
    name: j_gene
    description: J gene designation for the chain
    range: string

  j_subgroup:
    name: j_subgroup
    description: J gene subgroup/family designation for the chain
    range: string

  isotype:
    name: isotype
    description: The isotype of the chain
    range: string

  igh_chain:
    description: IG heavy chain
    range: uriorcurie

  igl_chain:
    description: IG lambda light chain
    range: uriorcurie

  igk_chain:
    description: IG kappa light chain
    range: uriorcurie

  tra_chain:
    description: T cell receptor alpha chain
    range: uriorcurie

  trb_chain:
    description: T cell receptor beta chain
    range: uriorcurie

  trd_chain:
    description: T cell receptor delta chain
    range: uriorcurie

  trg_chain:
    description: T cell receptor gamma chain
    range: uriorcurie

  ab_tcr:
    description: alpha/beta T cell receptor
    range: AlphaBetaTCR

  gd_tcr:
    description: gamma/delta T cell receptor
    range: GammaDeltaTCR

  source_molecule:
    description: The protein or other molecule that this antigen represents

  source_species:
    description: The species that the source molecule comes from
    range: TaxonomicSpecies

  antibody:
    description: B cell receptor, immunoglobulin antibody
    range: BCellReceptor

  antigen:
    description: A material entity with antigen role
    range: Antigen

  epitope:
    description: Epitope of an antigen, which can be recognized by a T cell receptor or antibody
    range: Epitope

  epitope_ref:
    description: CURIE identifiers for external epitope records
    range: uriorcurie

  positional_residues:
    description: Numbered amino acid residues of a conformational epitope
    range: string

  modifications:
    description: Post-translational modifications to the epitope peptide sequence
    range: string

  mhc:
    description: Major histocompatibility complex
    range: MajorHistocompatibilityComplex

  mhc_ref:
    description: MHC Restriction Ontology term id
    range: MHCRestriction

  epitope_name:
    description: Name of the non-peptidic epitope
    range: string

  mhc_label:
    description: Human-readable label of the major histocompatibility complex
    range: string

  mhc_class:
    description: Class of the major histocompatibility complex
    range: MhcClassEnum # from AIRR

  tcr_complex:
    description: TCR complex
    range: TCRpMHCComplex

  antibody_complex:
    description: Antibody antigen complex
    range: AntibodyAntigenComplex
